name: BotBounty agent scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore bounty history
        uses: actions/cache@v4
        with:
          path: .agent_state
          key: botbounty-history-${{ github.run_id }}
          restore-keys: |
            botbounty-history-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m botbounty_agent
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: botbounty-scan-report-${{ github.run_number }}
          path: .agent_reports/latest.md
          if-no-files-found: warn
          retention-days: 30
